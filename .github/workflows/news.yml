name: News aktualisieren

on:
  schedule:
    - cron: "17 * * * *"   # jede Stunde zur Minute 17 (UTC)
    - cron: "47 * * * *"   # zusätzlich zur Minute 47, falls GitHub einen Lauf auslässt
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Schlagzeilen holen
        run: python3 scripts/news.py
      - name: Kurse, Stimmung und Alarme
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/alerts.py
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json market.json alerts_state.json
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -m "News $(date -u +'%d.%m. %H:%M UTC')"
          git pull --rebase origin main
          git push
